# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🎬 VIDEO MAESTRO - RENDER.COM CONFIGURATION (FREE TIER)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Optimisé pour plan gratuit Render
# RAM: 512MB | CPU: 0.1 vCPU | Disk: 0GB persistent
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🎬 Backend Node.js avec Docker (FREE TIER)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: video-maestro-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    
    # Build configuration
    buildCommand: ""  # Docker build uniquement
    
    # Variables d'environnement
    envVars:
      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      
      # Redis Upstash (GRATUIT - TLS)
      - key: REDIS_URL
        sync: false  # À configurer dans Dashboard
      
      # Firebase Backend
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      
      # Services IA locaux (automatiques)
      - key: TTS_SERVICE_URL
        value: http://localhost:5001
      - key: WHISPER_SERVICE_URL
        value: http://localhost:5002
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_MODELS_DIR
        value: /opt/whisper/models
      
      # FFmpeg (installé dans Docker)
      - key: FFMPEG_BINARY
        value: ffmpeg
      - key: FFPROBE_BINARY
        value: ffprobe
      
      # Storage (éphémère sur free tier)
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: OUTPUT_DIR
        value: /app/outputs
      - key: AUTO_CLEANUP_DAYS
        value: 1
      
      # Security
      - key: ALLOWED_ORIGINS
        value: https://video-maestros.netlify.app,https://localhost:3000
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 50
      
      # Monitoring
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_METRICS
        value: false
      
      # Start.io Ads
      - key: STARTIO_ENABLED
        value: true
      - key: STARTIO_PUBLISHER_ID
        sync: false
    
    # Health check
    healthCheckPath: /api/health
    
    # Auto-deploy on push
    autoDeploy: true
    
    # Branch
    branch: main

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
