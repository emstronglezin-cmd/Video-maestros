# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🎬 VIDEO MAESTRO V3 - RENDER.COM CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Production deployment configuration for Render.com
# Complete open-source stack with Docker support
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 🎬 Backend Node.js avec Docker
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: web
    name: video-maestro-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    
    # Variables d'environnement
    envVars:
      # Server
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      
      # Redis Upstash (TLS)
      - key: REDIS_URL
        sync: false  # À configurer dans Render Dashboard
      
      # Firebase Backend
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      
      # Services IA locaux (automatiques)
      - key: TTS_SERVICE_URL
        value: http://localhost:5001
      - key: WHISPER_SERVICE_URL
        value: http://localhost:5002
      - key: PIPER_MODELS_DIR
        value: /opt/piper/models
      - key: WHISPER_MODELS_DIR
        value: /opt/whisper/models
      
      # FFmpeg (installé automatiquement)
      - key: FFMPEG_BINARY
        value: ffmpeg
      - key: FFPROBE_BINARY
        value: ffprobe
      
      # Ollama (optionnel - désactivé par défaut)
      - key: OLLAMA_URL
        value: ""
      
      # Storage
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: OUTPUT_DIR
        value: /app/outputs
      - key: AUTO_CLEANUP_DAYS
        value: 7
      
      # Security
      - key: ALLOWED_ORIGINS
        value: https://video-maestros.netlify.app,https://video-maestro.netlify.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # Monitoring
      - key: LOG_LEVEL
        value: info
      - key: ENABLE_METRICS
        value: true
    
    # Health check
    healthCheckPath: /api/health
    
    # Disks persistants
    disk:
      name: video-maestro-storage
      mountPath: /app
      sizeGB: 10

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 📋 INSTRUCTIONS DE DÉPLOIEMENT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 1. Créer un compte Render: https://render.com
# 2. Créer un nouveau Web Service depuis GitHub
# 3. Sélectionner ce repository (branche main)
# 4. Render détectera automatiquement render.yaml
# 5. Configurer les variables d'environnement sensibles:
#    - REDIS_URL (Upstash Redis)
#    - FIREBASE_PROJECT_ID
#    - FIREBASE_PRIVATE_KEY
#    - FIREBASE_CLIENT_EMAIL
# 6. Déployer
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 🔗 REDIS UPSTASH (Gratuit)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# 1. Créer un compte: https://console.upstash.com/
# 2. Créer une base Redis (plan gratuit: 10,000 commandes/jour)
# 3. Copier l'URL TLS (rediss://...)
# 4. Ajouter dans Render:
#    Variable: REDIS_URL
#    Valeur: rediss://default:xxxxx@xxxx.upstash.io:6380
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
