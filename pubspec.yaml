name: video_maestro
description: "Application de montage vidéo automatique avec IA - Web & Mobile"
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client pour communiquer avec le backend
  http: 1.5.0

  # State management
  provider: 6.1.5+1

  # File picker WEB COMPATIBLE
  file_picker: ^8.1.6

  # Video player WEB COMPATIBLE
  video_player: ^2.10.0
  video_player_web: ^2.3.3

  # Local storage WEB COMPATIBLE
  shared_preferences: 2.5.3
  shared_preferences_web: ^2.4.2

  # Path utilities (web compatible)
  path: ^1.9.1

  # Pour afficher le temps écoulé
  intl: ^0.20.2

  # Icons supplémentaires
  font_awesome_flutter: ^10.8.0

  # Firebase (versions fixes compatibles Flutter 3.35.4 + Web)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  firebase_core_web: 2.18.1
  firebase_auth_web: 5.13.2

  # Universal IO pour web/mobile compatibility
  universal_io: ^2.2.2

  # URL launcher pour web
  url_launcher: ^6.3.1
  url_launcher_web: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets si nécessaire
  # assets:
  #   - assets/images/
